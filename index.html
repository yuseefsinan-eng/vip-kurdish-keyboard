<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEYBOARD KURDISH - Profile Install</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
            background: #161616;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #d4af37;
        }
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #d4af37;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }
        h1 {
            font-size: 22px;
            color: #d4af37;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .subtitle {
            font-size: 14px;
            color: #aaaaaa;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #d4af37, #aa820a);
            color: #000000;
            font-weight: bold;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 16px;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
            width: 100%;
        }
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .instructions {
            margin-top: 25px;
            font-size: 12px;
            color: #777777;
            line-height: 1.6;
            text-align: right;
            background: #111111;
            padding: 12px;
            border-radius: 8px;
        }
        .instructions b {
            color: #d4af37;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- لۆگۆیا تە -->
        <img src="logo.png" alt="Keyboard Kurdish Logo" class="logo">
        
        <h1>KEYBOARD KURDISH</h1>
        <p class="subtitle">YOUSEF SINAN - VIP KEYBOARD</p>

        <!-- دوگمەیا دابەزاندنا پروفایلی -->
        <a href="vip-keyboard.mobileconfig" class="btn">دابەزاندنا پروفایلی (Install)</a>

        <div class="instructions">
            <b>رێنمایێن دابەزاندنێ:</b><br>
            1. ل دوگمەیا سەرەوە بدە بۆ دابەزاندنێ.<br>
            2. قەستا (Settings) مۆبایلا خۆ بکە.<br>
            3. پشکا (Profile Downloaded) هەلبژێرە و Install بکە.
        </div>
    </div>

</body>
</html>
