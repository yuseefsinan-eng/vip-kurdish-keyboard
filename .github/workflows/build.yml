name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Select Xcode Latest Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Create Proper App Bundle Structure
        run: |
          mkdir -p Payload/KurdishKeyboard.app
          
          cat << 'EOF' > Payload/KurdishKeyboard.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.yousef.kurdishkeyboard</string>
              <key>CFBundleName</key>
              <string>Kurdish Keyboard</string>
              <key>CFBundleExecutable</key>
              <string>KurdishKeyboard</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
          </dict>
          </plist>
          EOF

          cp *.swift Payload/KurdishKeyboard.app/ 2>/dev/null || true
          echo "Binary placeholder for iOS keyboard extension" > Payload/KurdishKeyboard.app/KurdishKeyboard
          chmod +x Payload/KurdishKeyboard.app/KurdishKeyboard

          # Custom name for the IPA file
          zip -r vip-kurdish-keyboard.ipa Payload

      - name: Upload Generated IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kurdish-keyboard-ipa
          path: vip-kurdish-keyboard.ipa
