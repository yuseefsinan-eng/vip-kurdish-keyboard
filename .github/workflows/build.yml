name: Build VIP Kurdish Keyboard

on:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Build APK Placeholder
      run: |
        mkdir -p build/app/outputs/flutter-apk/
        echo "VIP Kurdish Keyboard Android Build" > build/app/outputs/flutter-apk/app-release.apk
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: android-apk
        path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build IPA Placeholder
      run: |
        mkdir -p build/ios/ipa/
        echo "VIP Kurdish Keyboard iOS Build" > build/ios/ipa/VIPKurdishKeyboard.ipa
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v3
      with:
        name: ios-ipa
        path: build/ios/ipa/VIPKurdishKeyboard.ipa
