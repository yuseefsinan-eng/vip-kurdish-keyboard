        uses: actions/checkout@v3

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '14.2'

      - name: Build IPA (Simulation/Archive)
        run: |
          echo "Building iOS App..."
          # ل ڤێرە کۆدێن کامپایلاکردنێ بۆ xcodebuild دێ هێنە دانان گەر پڕۆژەیا تە فایلێ .xcodeproj یان .xcworkspace هەبیت.
