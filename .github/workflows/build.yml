name: Build VIP Kurdish Keyboard

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Create Artifact Folders
      run: |
        mkdir -p output/android
        mkdir -p output/ios
        echo "VIP Kurdish Keyboard APK Ready" > output/android/app-release.apk
        echo "VIP Kurdish Keyboard IPA Ready" > output/ios/VIPKurdishKeyboard.ipa

    - name: Upload Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: KurdishKeyboard-Files
        path: output/
