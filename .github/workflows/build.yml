name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Select Xcode Latest
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build IPA Info
        run: |
          xcodebuild -version
          echo "Xcode is ready!"
