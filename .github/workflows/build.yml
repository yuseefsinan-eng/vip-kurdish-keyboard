name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Select Xcode Latest Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Create Payload Directory and Package IPA
        run: |
          mkdir -p Payload
          zip -r app.ipa Payload

      - name: Upload Generated IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: app.ipa
